name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # pg.zig translates OpenSSL's headers.
      - run: sudo apt-get install -y --no-install-recommends libssl-dev
      - run: zig fmt --check src build.zig
      - run: zig build test --summary all
